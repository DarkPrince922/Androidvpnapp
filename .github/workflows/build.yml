name: Build APK

on:
  push:
    branches: ["**"]
    # правки документации и релизного workflow не требуют пересборки APK
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - ".github/workflows/release.yml"
      - ".gitignore"
  workflow_dispatch:

# новый push отменяет предыдущую сборку той же ветки — иначе они копятся
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Публикуем обычный commit status: его видят PR и GitHub-коннектор,
# даже когда workflow запущен событием push.
permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download libv2ray.aar (Xray core)
        run: bash scripts/download-libv2ray.sh

      - name: Download geodata (geoip/geosite)
        run: bash scripts/download-geodata.sh

      - name: Build hev-socks5-tunnel (TUN -> SOCKS)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/compile-hevtun.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Собираем, но не выгружаем: неподписанный APK всё равно не установить,
      # зато сама сборка проверяет то, чего не видно в debug — минификацию и
      # правила R8. Ломается это регулярно, поэтому шаг остаётся.
      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      # retention-days: по умолчанию GitHub держит артефакты 90 дней, а квота
      # хранилища общая на весь аккаунт — пары сотен мегабайт с каждого пуша
      # хватало, чтобы она кончилась и прогоны начали падать на выгрузке.
      # Неделя перекрывает всё, ради чего этот файл вообще качают.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish build status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ job.status }}
        run: |
          if [ "$BUILD_RESULT" = "success" ]; then
            STATE="success"
            DESCRIPTION="Debug and release APKs built successfully"
          else
            STATE="failure"
            DESCRIPTION="Android APK build failed"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context="Build APK" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
