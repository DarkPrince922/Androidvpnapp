name: Build APK

on:
  push:
    branches: ["**"]
    # правки документации и релизного workflow не требуют пересборки APK
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - ".github/workflows/release.yml"
      - ".gitignore"
  workflow_dispatch:

# новый push отменяет предыдущую сборку той же ветки — иначе они копятся
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download libv2ray.aar (Xray core)
        run: bash scripts/download-libv2ray.sh

      - name: Download geodata (geoip/geosite)
        run: bash scripts/download-geodata.sh

      - name: Build hev-socks5-tunnel (TUN -> SOCKS)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/compile-hevtun.sh

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
