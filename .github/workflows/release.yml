name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия релиза: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download libv2ray.aar (Xray core)
        run: bash scripts/download-libv2ray.sh

      - name: Download geodata (geoip/geosite)
        run: bash scripts/download-geodata.sh

      - name: Build hev-socks5-tunnel (TUN -> SOCKS)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/compile-hevtun.sh

      - name: Восстановить keystore из секретов
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Keystore восстановлен"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK будет неподписанным"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Подготовить артефакт
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEST="DarkPrinceVPN-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Версия ${{ steps.version.outputs.version }}

          Установка: скачайте APK и разрешите установку из неизвестных источников.

          SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "DarkPrince VPN ${{ steps.version.outputs.version }}" \
            --notes "$NOTES" \
            --repo "${{ github.repository }}" \
            || gh release upload "v${{ steps.version.outputs.version }}" \
                 "${{ steps.apk.outputs.path }}" --clobber \
                 --repo "${{ github.repository }}"

      - name: Выгрузить APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
