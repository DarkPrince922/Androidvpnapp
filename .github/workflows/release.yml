name: Release

on:
  push:
    tags: ["v*"]
    branches: ["probe/server-access"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.0.0)"
        required: true

permissions:
  contents: write
  statuses: write

# релизы одной версии не должны собираться параллельно, но начатый
# релиз не прерываем — иначе можно получить полузалитый файл
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/probe/server-access'
    runs-on: ubuntu-latest
    steps:
      - name: Проверить сервер обновлений
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: b55b120b5be7f5a07e49a25db75db8353e67a02f
        run: |
          IP=$(getent ahostsv4 dprince.online | awk '{print $1}' | sort -u | head -n1)
          SSH=closed
          if [ -n "$IP" ] && timeout 5 bash -c "cat < /dev/null > /dev/tcp/$IP/22" 2>/dev/null; then
            SSH=open
          fi

          SITE_JSON=$(curl -fsSL --max-time 15 "https://dprince.online/downloads.json?ts=$(date +%s)" || true)
          SITE_VERSION=$(printf '%s' "$SITE_JSON" | jq -r '.android.version // "missing"' 2>/dev/null || echo missing)
          MANIFEST=$(curl -fsSL --max-time 15 "https://dprince.online/updates/android.json?ts=$(date +%s)" || true)
          VERSION=$(printf '%s' "$MANIFEST" | jq -r '.version // "missing"' 2>/dev/null || echo missing)
          APK_SHA=$(curl -fsSL --max-time 120 "https://dprince.online/downloads/DarkPrinceVPN.apk?ts=$(date +%s)" \
            | sha256sum | cut -d' ' -f1)
          CACHE=$(curl -fsSI --max-time 15 https://dprince.online/updates/android.json \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1) == "cache-control" {print $2; exit}')
          DESCRIPTION="site=$SITE_VERSION ssh=$SSH manifest=$VERSION apk=${APK_SHA:-missing} cache=${CACHE:-missing}"
          STATE=success
          EXPECTED_SHA=29b7a7ffc2591a915da173695597d383588ea981f2dc2efabe1eaf2522a33768
          [ -n "$IP" ] && [ "$SITE_VERSION" = "1.2.4" ] && [ "$VERSION" = "1.2.4" ] && [ "$APK_SHA" = "$EXPECTED_SHA" ] || STATE=failure

          gh api --method POST \
            "repos/${{ github.repository }}/statuses/$TARGET_SHA" \
            -f state="$STATE" \
            -f context="server/probe" \
            -f description="$(printf '%s' "$DESCRIPTION" | cut -c1-140)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release:
    if: github.ref != 'refs/heads/probe/server-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить версию
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Версия релиза: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download libv2ray.aar (Xray core)
        run: bash scripts/download-libv2ray.sh

      - name: Download geodata (geoip/geosite)
        run: bash scripts/download-geodata.sh

      - name: Build hev-socks5-tunnel (TUN -> SOCKS)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bash scripts/compile-hevtun.sh

      - name: Восстановить keystore из секретов
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK будет неподписанным"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

          # Проверяем сразу: иначе ошибка вылезет только через несколько
          # минут, на этапе подписи APK. keytool для этого не годится — в
          # PKCS12 он игнорирует пароль ключа, поэтому читаем ключ напрямую.
          cat > "$RUNNER_TEMP/KeystoreCheck.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;

          public class KeystoreCheck {
              public static void main(String[] args) throws Exception {
                  KeyStore ks = KeyStore.getInstance("PKCS12");
                  try (FileInputStream in = new FileInputStream(args[0])) {
                      ks.load(in, args[1].toCharArray());
                  }
                  if (!ks.containsAlias(args[2])) {
                      System.out.println("NO_ALIAS");
                      System.exit(1);
                  }
                  for (int i = 3; i < args.length; i++) {
                      try {
                          if (ks.getKey(args[2], args[i].toCharArray()) != null) {
                              System.out.println("OK");
                              return;
                          }
                      } catch (Exception ignored) { }
                  }
                  System.out.println("NO_KEY_PASSWORD");
                  System.exit(1);
              }
          }
          JAVA
          sed -i 's/^          //' "$RUNNER_TEMP/KeystoreCheck.java"
          if ! java "$RUNNER_TEMP/KeystoreCheck.java" "$RUNNER_TEMP/release.jks" \
                "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$KEYSTORE_PASSWORD"; then
            echo "::error::Ключ не открывается: проверьте KEYSTORE_PASSWORD, KEY_ALIAS и KEY_PASSWORD"
            exit 1
          fi
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          echo "Keystore проверен: ключ читается"

      - name: Собрать release APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          # RELEASE_VERSION_CODE не задаём: номер сборки считается из версии,
          # см. versionCodeOf в app/build.gradle.kts. Номер прогона CI сюда не
          # годится — он с версией не связан и при перезапуске мог оказаться
          # меньше уже установленного, после чего APK перестал бы ставиться.
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Подготовить артефакт
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEST="DarkPrinceVPN-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

          # Отпечаток сертификата: подтверждает, что APK подписан нашим ключом
          FP=$(keytool -printcert -jarfile "$DEST" 2>/dev/null \
               | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [ -z "$FP" ]; then
            echo "::error::APK не подписан — сертификат не найден"
            exit 1
          fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo "Подписан, отпечаток сертификата: $FP"
          ls -lh "$DEST"

          # Манифест обновлений. Формат свой: плагина Tauri тут нет, читает его
          # наш AppUpdater. Адрес ведёт на наш сайт, а не на GitHub — у части
          # пользователей он недоступен ровно тогда, когда обновление и нужно.
          # Имя файла на сайте без версии, поэтому ссылка постоянная.
          #
          # Номер сборки считаем той же формулой, что и Gradle: 1.2.1 -> 10201.
          VERSION="${{ steps.version.outputs.version }}"
          VERSION="${VERSION#v}"
          CODE=$(echo "$VERSION" | awk -F. '{ printf "%d", $1 * 10000 + $2 * 100 + $3 }')

          cat > android.json <<JSON
          {
            "version": "$VERSION",
            "versionCode": $CODE,
            "notes": "DarkPrince VPN $VERSION",
            "url": "https://dprince.online/downloads/DarkPrinceVPN.apk",
            "sha256": "$(sha256sum "$DEST" | cut -d" " -f1)"
          }
          JSON
          sed -i 's/^          //' android.json
          cat android.json

      - name: Создать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          NOTES=$(cat <<EOF
          Версия $VERSION

          Установка: скачайте APK и разрешите установку из неизвестных источников.

          SHA-256 файла: \`${{ steps.apk.outputs.sha256 }}\`
          Отпечаток сертификата подписи: \`${{ steps.apk.outputs.fingerprint }}\`
          EOF
          )
          NOTES=$(echo "$NOTES" | sed 's/^          //')
          if ! gh release create "v$VERSION" "$APK" android.json \
                --title "DarkPrince VPN $VERSION" \
                --notes "$NOTES" \
                --repo "${{ github.repository }}"; then
            # релиз уже существует — обновляем и файлы, и описание
            gh release upload "v$VERSION" "$APK" android.json --clobber --repo "${{ github.repository }}"
            gh release edit "v$VERSION" \
              --title "DarkPrince VPN $VERSION" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi

      - name: Выгрузить APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
